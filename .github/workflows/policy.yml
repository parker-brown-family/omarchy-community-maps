name: Trusted contribution policy
on:
  pull_request_target:
    branches: [master, main, "release/**"]
    types: [opened, synchronize, reopened, edited, ready_for_review]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: trusted-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  trusted-policy:
    name: trusted-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out protected base only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Validate proposed files as data with trusted code
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I tools/trusted_policy.py
