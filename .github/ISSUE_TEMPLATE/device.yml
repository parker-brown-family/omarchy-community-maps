name: Device evidence
description: Report one capability on exact hardware; failures welcome.
title: "[Evidence] "
labels: ["device-evidence"]
body:
  - type: input
    id: registry
    attributes:
      label: Device registry entry or new exact model
      description: Search docs/devices.html or tools/devices.py first. Give the device ID, model identifier and regional variant; say new model if absent. Never include a serial or IMEI.
    validations:
      required: true
  - type: textarea
    id: previous
    attributes:
      label: Earlier tests and configuration differences
      description: Link any matching records. State whether the OS lane, OS build, hardware variant and app revision match. An absent record means untested here.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Hardware and software
      description: Model, OS/kernel, app revision, provider/pack version. No serials or private addresses.
    validations:
      required: true
  - type: textarea
    id: procedure
    attributes:
      label: Procedure and expected result
      description: Steps another operator can repeat, plus what should happen.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Observed result and limits
      description: Date, evidence kind, failures, sanitized artifacts/checksums and independent reviewer if available.
    validations:
      required: true
